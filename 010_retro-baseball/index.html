<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Retro Plate Baseball</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div class="game-stage">
      <canvas id="gameCanvas" width="390" height="720" aria-label="レトロ野球ゲーム"></canvas>
    </div>
    <button id="debugButton" class="debug-button" type="button" aria-pressed="false" aria-controls="debugCanvas" hidden>Debug</button>
    <canvas id="debugCanvas" width="390" height="180" aria-label="Debug: sprites and timing" hidden></canvas>
  </main>
  <script src="main.js"></script>
</body>
</html>
