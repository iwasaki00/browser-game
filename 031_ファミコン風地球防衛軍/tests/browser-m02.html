<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M02 local QA fixture</title>
<body style="background:#071522;color:#e4fff6;font:16px sans-serif;padding:24px">
<h1>M02 / 独立オリジン用ローカルQA</h1>
<p>既存セーブのないlocalhost専用ポートでのみ使用してください。M01クリア済みの旧形式データを作り、通常のゲームへ移動します。敵・移動・ボスへのワープや性能変更はしません。</p>
<button id="prepare" style="min-height:44px">旧M01クリアデータで起動（未使用オリジンのみ）</button><p id="message" role="status"></p>
<script type="module">
import {SAVE_KEY,WEAPONS} from '../js/data.js?v=0.2.2';
document.querySelector('#prepare').onclick=()=>{
  if(!['localhost','127.0.0.1'].includes(location.hostname)){document.querySelector('#message').textContent='ローカルQA以外では無効です';return}
  if(localStorage.getItem(SAVE_KEY)){document.querySelector('#message').textContent='既存データがあるため書き換えません。別ポートを使用してください。';return}
  localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,cleared:['M01'],selectedClass:'GUARDIAN',unlocked:WEAPONS.map(w=>w.id),equipped:['P-13','P-12'],settings:{sound:false,enemyDensity:'STANDARD'}}));
  location.href='../?debug=1';
};
</script></body></html>
