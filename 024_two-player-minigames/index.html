<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071421">
  <meta name="description" content="机に置いた1台のスマートフォンを両側から操作して遊ぶ、ローカル2人対戦ミニゲーム集。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>ふたり対戦 ミニゲーム</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/bomb.css">
  <link rel="stylesheet" href="./css/boxing.css">
  <link rel="stylesheet" href="./css/hockey.css">
  <script src="./js/games/sumo.js" defer></script>
  <script src="./js/games/tug-of-war.js" defer></script>
  <script src="./js/games/bomb-push.js" defer></script>
  <script src="./js/games/wobble-boxing-sideview.js" defer></script>
  <script src="./js/games/table-hockey.js" defer></script>
  <script src="./js/game-manager.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section id="menuScreen" class="screen menu-screen" aria-labelledby="collectionTitle">
      <header class="menu-header">
        <a class="arcade-link" href="../index.html" aria-label="Browser Game Arcadeへ戻る">← ARCADE</a>
        <div class="menu-tools">
          <button id="menuTestModeButton" class="test-mode-button" type="button" aria-label="対応ゲームのテストモードを有効にする" aria-pressed="false">TEST OFF</button>
          <button id="menuMuteButton" class="icon-button" type="button" aria-label="音をミュート">♪</button>
        </div>
      </header>
      <div class="menu-intro">
        <p>ONE PHONE · TWO PLAYERS</p>
        <h1 id="collectionTitle">ふたり対戦 <span>ミニゲーム</span></h1>
      </div>
      <div class="game-picker" aria-label="ゲームを選択">
        <button id="sumoCard" class="game-card" type="button">
          <span class="game-card-number" aria-hidden="true">01</span>
          <span class="game-card-copy"><small>TAP BATTLE</small><strong>トントン相撲DX</strong><em>端末を机に置いて、両側から連打！</em></span>
          <span class="play-mark" aria-hidden="true">▶</span>
        </button>
        <button id="tugCard" class="game-card" type="button">
          <span class="game-card-number" aria-hidden="true">02</span>
          <span class="game-card-copy"><small>RHYTHM &amp; STAMINA</small><strong>綱引きバトル</strong><em>リズムよく引いて、相手を勝利線へ！</em></span>
          <span class="play-mark" aria-hidden="true">▶</span>
        </button>
        <button id="bombCard" class="game-card" type="button">
          <span class="game-card-number" aria-hidden="true">03</span>
          <span class="game-card-copy"><small>TAP &amp; CHARGE</small><strong>爆弾押し付け</strong><em>押し返せ。いつ爆発するかは分からない！</em></span>
          <span class="play-mark" aria-hidden="true">▶</span>
        </button>
        <button id="boxingCard" class="game-card" type="button">
          <span class="game-card-number" aria-hidden="true">04</span>
          <span class="game-card-copy"><small>JOINT CONTROL</small><strong>よろよろボクシング</strong><em>4つの関節を操って、自分でパンチを作れ！</em></span>
          <span class="play-mark" aria-hidden="true">▶</span>
        </button>
        <button id="hockeyCard" class="game-card" type="button">
          <span class="game-card-number" aria-hidden="true">05</span>
          <span class="game-card-copy"><small>DIRECT DRAG</small><strong>卓上ホッケー</strong><em>同時にパドルを操って、先に3点を決めろ！</em></span>
          <span class="play-mark" aria-hidden="true">▶</span>
        </button>
        <div class="coming-list" aria-label="今後追加予定">
          <div><span>06</span><b>次の対戦ゲーム</b><small>COMING SOON</small></div>
        </div>
      </div>
    </section>
    <section id="gameScreen" class="screen game-screen" hidden aria-label="2人対戦ゲーム画面">
      <header class="game-header">
        <button id="backButton" class="header-button" type="button" aria-label="ゲーム選択へ戻る">‹</button>
        <button id="testSpeedButton" class="header-button test-speed-button" type="button" aria-label="テスト速度 1.0倍" hidden>1.0x</button>
        <button id="testModeButton" class="header-button test-mode-button" type="button" aria-label="テストモードを有効にする" aria-pressed="false" hidden>TEST OFF</button>
        <button id="muteButton" class="header-button" type="button" aria-label="音をミュート">♪</button>
      </header>
      <div class="arena">
        <canvas id="gameCanvas" aria-label="2人対戦ゲームの盤面"></canvas>
        <div id="dangerLeft" class="danger danger-top" aria-hidden="true">DANGER</div>
        <div id="dangerRight" class="danger danger-bottom" aria-hidden="true">DANGER</div>
        <div id="countdown" class="countdown" role="status" aria-live="assertive"></div>
        <div id="debugPanel" class="debug-panel" hidden></div>
      </div>
      <div class="controls" aria-label="プレイヤー操作">
        <div id="p1Control" class="control-zone control-one" role="group" aria-label="PLAYER 1 操作"><span class="control-player">PLAYER 1 <b id="p1Score" class="control-score">0</b></span><strong id="p1Action">トントン！</strong><span id="p1EnergyName" class="energy-name">POWER</span><span class="energy-track"><i id="p1Energy"></i></span><small>A キーでも操作</small><div class="joint-grid" aria-label="PLAYER 1 関節操作"><button type="button" data-player="0" data-joint="arm1Shoulder">① 肩</button><button type="button" data-player="0" data-joint="arm2Shoulder">② 肩</button><button type="button" data-player="0" data-joint="arm1Elbow">① 肘</button><button type="button" data-player="0" data-joint="arm2Elbow">② 肘</button></div></div>
        <div class="center-rivet" aria-hidden="true"><span id="centerBadge">VS</span></div>
        <div id="p2Control" class="control-zone control-two" role="group" aria-label="PLAYER 2 操作"><span class="control-player">PLAYER 2 <b id="p2Score" class="control-score">0</b></span><strong id="p2Action">トントン！</strong><span id="p2EnergyName" class="energy-name">POWER</span><span class="energy-track"><i id="p2Energy"></i></span><small>L キーでも操作</small><div class="joint-grid" aria-label="PLAYER 2 関節操作"><button type="button" data-player="1" data-joint="arm1Shoulder">① 肩</button><button type="button" data-player="1" data-joint="arm2Shoulder">② 肩</button><button type="button" data-player="1" data-joint="arm1Elbow">① 肘</button><button type="button" data-player="1" data-joint="arm2Elbow">② 肘</button></div></div>
      </div>
      <div id="resultPanel" class="result-panel" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-card"><p>RESULT</p><h2 id="resultTitle">PLAYER 1 WIN!</h2><span id="resultReason">押し出し！</span><div class="result-actions"><button id="replayButton" class="primary-button" type="button">もう一度</button><button id="menuButton" class="secondary-button" type="button">ゲーム選択へ</button></div></div>
      </div>
    </section>
  </main>
</body>
</html>
