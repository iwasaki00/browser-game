<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="サイコロの目と同じボタンを、数字の回数だけ1拍の中でタップするリズムゲーム。">
  <title>Dice Rhythm Challenge</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="app" aria-label="Dice Rhythm Challenge">
    <header class="topbar">
      <a class="back" href="../index.html" aria-label="ゲーム一覧へ戻る">‹</a>
      <div class="brand"><span>DICE</span><strong>RHYTHM</strong></div>
      <div class="lives" id="lives" aria-label="ライフ3">● ● ●</div>
    </header>
    <section class="scorebar" aria-label="プレイ状況">
      <div><span>SCORE</span><strong id="score">000000</strong></div>
      <div class="beat-readout"><span>BEAT</span><strong id="beatNumber">01</strong></div>
      <div><span>COMBO</span><strong id="combo">0</strong></div>
    </section>
    <section class="playfield" aria-label="4かける4のサイコログリッド">
      <div class="field-head"><span>4 × 4 SEQUENCE</span><span id="bpmDisplay">♪ = 120 BPM</span></div>
      <div class="grid" id="grid" role="list" aria-label="現在の譜面"></div>
      <div class="beat-track" aria-hidden="true"><i id="beatProgress"></i></div>
      <div class="judgement" id="judgement" aria-live="polite"></div>
      <div class="test-panel" id="testPanel" hidden><span>TEST</span><b id="testBpm">120 BPM</b><b id="testCell">CELL 01</b><b id="testTaps">TAPS 0 / 1</b><b id="testElapsed">TIME 0 / 500ms</b></div>
    </section>
    <section class="controls" aria-label="サイコロ入力">
      <p>光っている目と同じボタンを、目の数だけタップ</p>
      <div class="button-row">
        <button class="dice-button red" type="button" data-value="1" aria-label="赤の1をタップ"><span class="mini-die face-1" aria-hidden="true"><i></i></span><b>1</b><small>RED</small></button>
        <button class="dice-button purple" type="button" data-value="4" aria-label="紫の4をタップ"><span class="mini-die face-4" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>4</b><small>PURPLE</small></button>
        <button class="dice-button blue" type="button" data-value="2" aria-label="青の2をタップ"><span class="mini-die face-2" aria-hidden="true"><i></i><i></i></span><b>2</b><small>BLUE</small></button>
      </div>
    </section>
    <section class="overlay start-screen" id="startScreen">
      <div class="start-card">
        <div class="logo-die face-4" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="kicker">TAP THE BEAT</p><h1>Dice Rhythm<br><em>Challenge</em></h1>
        <p class="howto">サイコロと同じボタンを<br><strong>数字の回数だけ</strong>リズムよくタップ！</p>
        <fieldset class="bpm-picker"><legend>BPM SELECT</legend><div id="bpmOptions"><button type="button" data-bpm="100">100</button><button class="selected" type="button" data-bpm="120">120</button><button type="button" data-bpm="140">140</button><button type="button" data-bpm="160">160</button><button type="button" data-bpm="180">180</button><button type="button" data-bpm="200">200</button></div></fieldset>
        <label class="test-toggle"><input id="testMode" type="checkbox"><span aria-hidden="true"></span>TEST MODE</label>
        <button class="start-button" id="startButton" type="button">START <span>▶</span></button>
      </div>
    </section>
    <section class="overlay game-over" id="gameOver" hidden><div class="result-card"><p>RUN COMPLETE</p><h2>GAME OVER</h2><div class="result-stats"><div><span>SCORE</span><strong id="finalScore">0</strong></div><div><span>MAX COMBO</span><strong id="maxCombo">0</strong></div></div><button id="retryButton" type="button">RETRY <span>↻</span></button></div></section>
    <section class="overlay pause-screen" id="pauseScreen" hidden><div class="result-card"><p>GAME PAUSED</p><h2>READY?</h2><button id="resumeButton" type="button">RESUME <span>▶</span></button></div></section>
  </main>
</body>
</html>
