<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="ブラウザですぐ遊べる、23本のオリジナルゲームを集めたミニアーケード。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Browser Game Arcade</title>
  <link rel="icon" href="./assets/game-icons/023-ore-sound-game.jpg">
  <link rel="stylesheet" href="menu.css">
  <script src="menu.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#games">ゲーム一覧へ</a>

  <main class="shell">
    <header class="site-header">
      <div class="brand-block">
        <p class="eyebrow"><span aria-hidden="true"></span> Browser Game Arcade</p>
        <h1>遊べる<span>実験室</span></h1>
      </div>
      <div class="header-meta">
        <p>ブラウザで、すぐ遊ぶ。</p>
        <span class="game-count"><strong>23</strong> games</span>
      </div>
    </header>

    <aside class="gesture-guide" aria-label="操作方法">
      <span><b aria-hidden="true">↗</b> タップでゲーム開始</span>
      <span><b aria-hidden="true">●</b> 長押しでくわしく</span>
    </aside>

    <section id="games" class="game-grid" aria-label="ゲーム一覧"></section>
    <noscript>ゲーム一覧を表示するにはJavaScriptを有効にしてください。</noscript>

    <footer class="site-footer">
      <p>23 experiments, one browser.</p>
      <a href="#games">先頭へ戻る ↑</a>
    </footer>
  </main>

  <dialog id="gameDetails" class="detail-dialog" aria-labelledby="detailTitle">
    <div class="detail-panel">
      <button id="detailClose" class="detail-close" type="button" aria-label="説明を閉じる">×</button>
      <img id="detailIcon" src="./assets/game-icons/023-ore-sound-game.jpg" alt="" width="384" height="384">
      <div class="detail-copy">
        <span id="detailGenre"></span>
        <h2 id="detailTitle"></h2>
        <p id="detailDescription"></p>
        <a id="detailPlay" href="#">このゲームを遊ぶ <b aria-hidden="true">↗</b></a>
      </div>
    </div>
  </dialog>
</body>
</html>
