<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="惑星の重力でロケットの軌道を曲げ、ゲートを目指す2D物理パズルゲーム">
  <title>ORBIT MAKER — Gravity Core</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="kicker">GRAVITY LAB / 01</p>
        <h1>ORBIT <span>MAKER</span></h1>
      </div>
      <div class="version">v0.1.0</div>
    </header>

    <section class="mission" aria-label="ミッション">
      <div><small>MISSION</small><strong>最初のスイングバイ</strong></div>
      <p id="statusText" aria-live="polite">惑星を動かして、軌道をつくれ。</p>
    </section>

    <section class="space-frame" id="spaceFrame">
      <canvas id="gameCanvas" width="750" height="1000" aria-label="ロケット、惑星、ゴールがある宇宙空間"></canvas>
      <div class="result" id="result" hidden>
        <p id="resultLabel">MISSION FAILED</p>
        <strong id="resultReason">惑星に衝突</strong>
        <button id="retryButton" type="button">再試行</button>
      </div>
      <div class="edit-hint" id="editHint"><span></span> 惑星をドラッグ</div>
    </section>

    <section class="controls" aria-label="発射設定">
      <div class="tuner">
        <label for="angleInput"><span>ANGLE</span><output id="angleOutput">−55°</output></label>
        <input id="angleInput" type="range" min="-72" max="-35" value="-55" step="1">
      </div>
      <div class="tuner">
        <label for="speedInput"><span>THRUST</span><output id="speedOutput">170</output></label>
        <input id="speedInput" type="range" min="120" max="220" value="170" step="2">
      </div>
      <div class="actions">
        <button class="reset" id="resetButton" type="button">RESET</button>
        <button class="launch" id="launchButton" type="button"><span>▶</span> LAUNCH</button>
      </div>
    </section>
  </main>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
