<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="惑星の重力でロケットの軌道を曲げ、ゲートを目指す2D物理パズルゲーム">
  <title>ORBIT MAKER — Final Quality Audit</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="kicker">GRAVITY LAB / 01</p>
        <h1>ORBIT <span>MAKER</span></h1>
      </div>
      <div class="header-tools"><button id="openGallery" type="button">軌道一覧</button><div class="version">v0.9.0-A</div></div>
    </header>

    <section class="mission" aria-label="ミッション">
      <div><small>MISSION</small><strong>最初のスイングバイ</strong></div>
      <p id="statusText" aria-live="polite">惑星を動かして、軌道をつくれ。</p>
      <button id="openStages" type="button">遊び方</button>
    </section>

    <section class="space-frame" id="spaceFrame">
      <canvas id="gameCanvas" width="750" height="1000" aria-label="ロケット、惑星、ゴールがある宇宙空間"></canvas>
      <div id="experienceCue" class="experience-cue" role="status" aria-live="polite"></div>
      <div class="result" id="result" hidden>
        <p id="resultLabel">MISSION FAILED</p>
        <strong id="resultReason">惑星に衝突</strong>
        <button id="retryButton" type="button">再試行</button>
        <p id="clearStars" aria-live="polite"></p>
        <button id="nextStage" type="button" hidden>次ステージ</button>
      </div>
      <div class="edit-hint" id="editHint"><span></span><b id="editHintText">惑星をドラッグ</b></div>
    </section>

    <section class="controls" aria-label="発射設定">
      <div class="controls-body" aria-label="操作設定（上下スクロール可能）" tabindex="0">
      <div class="game-mode"><label>MODE <select id="gameMode" aria-label="ゲームモード"><option value="design">軌道設計</option><option value="live">重力操作</option></select></label><small id="gameModeHelp"></small></div>
      <details class="settings-panel" id="displayPanel"><summary>表示設定</summary>
      <div class="preview-options"><button id="previewToggle" type="button" aria-pressed="true">予測 ON</button><button id="gravityToggle" type="button" aria-pressed="false">重力目安 OFF</button><small>青：弱 ／ 黄：中 ／ 赤：強</small></div>
      <div class="experience-options"><label>演出品質 <select id="effectQuality"><option value="standard">標準</option><option value="light">軽量</option></select></label><button id="soundToggle" type="button" aria-pressed="false">サウンド OFF</button><small id="soundHelp">音は初期OFF。ONにして操作すると再生します。</small></div>
      </details>
      <details class="settings-panel" id="planetPanel"><summary>惑星編集</summary>
      <div class="planet-editor">
        <div class="planet-toolbar"><output id="planetSelection" aria-live="polite"></output><button id="addPlanet" type="button">＋ 追加</button><button id="deletePlanet" type="button">削除</button></div>
        <div class="planet-options"><label>種類 <select id="planetType"><option value="asteroid">小惑星</option><option value="earth">地球型惑星</option><option value="gas">巨大ガス惑星</option><option value="blackhole">ブラックホール</option><option value="repulsor">反重力惑星</option><option value="star">恒星</option><option value="dense">高密度惑星</option></select></label><label>サイズ <select id="planetSize"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select></label></div>
        <p id="planetFeature" class="planet-feature"></p>
        <p id="challengeConditions" class="planet-feature"></p>
        <label class="sample-label">体験配置 <select id="specialSample"><option value="">サンプルを選択</option><option value="blackhole">ブラックホール</option><option value="repulsor">反重力惑星</option><option value="star">恒星</option><option value="dense">高密度惑星</option></select></label>
      </div>
      </details>
      <div class="launch-mode" role="group" aria-label="発射方式">
        <button type="button" data-launch-mode="precision" aria-pressed="true"><span>A</span> 精密発射</button>
        <button type="button" data-launch-mode="slingshot" aria-pressed="false"><span>B</span> スリングショット</button>
      </div>

      <div class="precision-settings" id="precisionSettings">
        <div class="tuner">
          <label for="angleInput"><span>ANGLE</span><output id="angleOutput">−55°</output></label>
          <input id="angleInput" type="range" min="-72" max="-35" value="-55" step="1">
        </div>
        <div class="tuner">
          <label for="speedInput"><span>THRUST</span><output id="speedOutput">170</output></label>
          <input id="speedInput" type="range" min="120" max="220" value="170" step="2">
        </div>
      </div>

      <div class="slingshot-guide" id="slingshotGuide" hidden>
        <span aria-hidden="true">◀ · · 🚀</span>
        <p><strong>ロケットを引いて離す</strong><small>元の位置へ戻すとキャンセル</small></p>
      </div>
      </div>

      <div class="actions">
        <button class="reset" id="resetButton" type="button">RESET</button>
        <button class="launch" id="launchButton" type="button"><span>▶</span> LAUNCH</button>
      </div>
    </section>
  </main>
  <dialog id="stageDialog" aria-labelledby="stageDialogTitle">
    <header><h2 id="stageDialogTitle">ステージ攻略</h2><button id="closeStages" type="button">閉じる</button></header>
    <p>★1 到達 ／ ★2・★3 ステージごとの目標時間以内<br>重力操作の★3：惑星総移動30以内も必要</p>
    <p>軌道設計・重力操作の記録は別々に保存します。</p>
    <div id="stageList"></div>
    <button id="freePlay" type="button">フリープレイ</button>
  </dialog>
  <p id="galleryNotice" role="status" aria-live="polite"></p>
  <dialog id="galleryDialog" aria-labelledby="galleryTitle">
    <header><h2 id="galleryTitle">軌道ギャラリー</h2><button id="closeGallery" type="button">閉じる</button></header>
    <p id="galleryMessage" role="status"></p>
    <section id="galleryListView"><p id="galleryCount"></p><div id="galleryList"></div></section>
    <section id="galleryPlayer" hidden>
      <div class="replay-heading"><button id="replayBack" type="button">一覧へ</button><strong id="replayTitle"></strong><button id="openArt" type="button">画像作成</button></div>
      <div class="replay-board"><canvas id="replayCanvas" width="750" height="1000" aria-label="保存した飛行の再生"></canvas><strong id="replayResult" aria-live="polite"></strong></div>
      <output id="replayTime"></output>
      <div class="replay-controls"><button id="replayPlay" type="button">再生</button><button id="replayRestart" type="button">最初から</button><label>速度 <select id="replaySpeed"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label><button id="replayFull" type="button" aria-pressed="false">軌道全体</button></div>
    </section>
    <section id="artView" hidden>
      <header><button id="artBack" type="button">再生へ戻る</button><strong>軌道を画像にする</strong></header>
      <div class="art-options"><label>形 <select id="artShape"><option value="square">正方形</option><option value="portrait">縦長</option></select></label><label>背景 <select id="artBackground"><option value="space">宇宙</option><option value="simple">シンプル</option></select></label><label><input id="artText" type="checkbox" checked>文字情報</label></div>
      <div class="art-preview"><img id="artPreview" alt="保存画像の構図プレビュー"></div>
      <p id="artMessage" role="status" aria-live="polite"></p>
      <div class="art-actions"><button id="artGenerate" type="button">画像作成</button><button id="artSave" type="button" disabled>画像保存</button><button id="artShare" type="button" disabled>共有</button><a id="artOpenImage" target="_blank" rel="noopener" hidden>画像を開く</a></div>
    </section>
  </dialog>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
