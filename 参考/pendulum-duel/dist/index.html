<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e19"><meta name="description" content="3本の棒を振り回す物理対戦ゲーム。CPU戦と同じ画面での2人対戦。"><title>三重振り子 DUEL</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./"><span class="mark">Ⅲ</span><span>振り子<span class="duel">DUEL</span></span></a><div class="top-actions"><button id="sound" aria-label="効果音をオンにする">音 OFF</button><button id="pause" disabled>一時停止</button></div></header>
<section class="scoreboard" aria-label="対戦状況"><div class="player cyan"><div class="player-label"><span>01 / YOU</span><b id="hp0">100</b></div><div class="health"><i id="bar0"></i></div></div><div class="clock"><b id="time">60</b><span>SECONDS</span></div><div class="player orange"><div class="player-label"><span id="name1">02 / CPU</span><b id="hp1">100</b></div><div class="health"><i id="bar1"></i></div></div></section>
<section class="arena"><canvas id="game" aria-label="三重振り子の対戦フィールド"></canvas><div class="arena-tag">TRIPLE PENDULUM ARENA</div><div id="hint">先端の球を相手の中心に当てよう</div><div id="overlay" class="overlay"><div class="start-card"><div class="eyebrow">PHYSICS × DUEL</div><h1>その一振りは、<br><em>予測できない。</em></h1><p>振り回す。関節を固める。解き放つ。<br>3本の棒で、相手のコアを狙おう。</p><div class="modes" role="group" aria-label="対戦モード"><button id="cpu" class="selected" aria-pressed="true">1人で CPU戦</button><button id="local" aria-pressed="false">2人で 対戦</button></div><button id="start" class="primary">対戦をはじめる <span>↗</span></button><span class="small">60秒勝負 · 相手のHPを0にすれば勝利</span></div></div></section>
<section class="controls"><div class="control-side cyan"><div class="side-label">PLAYER 01 <span>A / S</span></div><div class="pad"><button id="swing0" class="swing">振り回す <small>長押し / A</small></button><button id="lock0" class="lock">固定 <small id="cool0">長押し / S</small></button></div></div><div class="control-note"><span>HOLD → RELEASE</span><p>固定は最大0.7秒。<br>離すタイミングで軌道が変わる。</p></div><div class="control-side orange"><div class="side-label" id="side1">CPU <span>K / L</span></div><div class="pad"><button id="swing1" class="swing" disabled>振り回す <small>長押し / K</small></button><button id="lock1" class="lock" disabled>固定 <small id="cool1">長押し / L</small></button></div></div></section><footer><span>力を溜めて、軌道を読む。</span><span>PCはキー操作 / スマホは両手で操作</span></footer></main><script src="game.js"></script></body></html>
